<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post a Pet | PetConnect</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <i class="fa-solid fa-paw"></i>
        <h2>PetConnect</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="pets.html">Adopt Pets</a>
    </nav>

</header>


<section class="post-pet-section">

    <div class="post-form">

        <h1>Post Your Pet for Adoption 🐾</h1>

        <p>
            Fill in the information below to help your pet
            find a loving home.
        </p>


        <form id="postPetForm">


            <!-- Pet Image -->

            <label>Pet Image</label>

            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
                required>


            <!-- Pet Name -->

            <label>Pet Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter pet name"
                required>


            <!-- Category -->

            <label>Pet Category</label>

            <select id="category" required>

                <option value="">Select Category</option>

                <option value="Dog">Dog</option>

                <option value="Cat">Cat</option>

                <option value="Rabbit">Rabbit</option>

                <option value="Bird">Bird</option>

                <option value="Fish">Fish</option>

            </select>


            <!-- Breed -->

            <label>Breed</label>

            <input
                type="text"
                id="breed"
                placeholder="Example: Labrador"
                required>


            <!-- Age -->

            <label>Age</label>

            <input
                type="text"
                id="age"
                placeholder="Example: 2 Years"
                required>


            <!-- Gender -->

            <label>Gender</label>

            <select id="gender" required>

                <option value="">Select Gender</option>

                <option value="Male">Male</option>

                <option value="Female">Female</option>

            </select>


            <!-- Vaccinated -->

            <label>Vaccinated</label>

            <select id="vaccinated" required>

                <option value="">Select</option>

                <option value="Yes">Yes</option>

                <option value="No">No</option>

            </select>


            <!-- Location -->

            <label>Location</label>

            <input
                type="text"
                id="location"
                placeholder="Example: Dhaka"
                required>


            <!-- Contact -->

            <label>Contact Number</label>

            <input
                type="tel"
                id="contact"
                placeholder="01XXXXXXXXX"
                required>


            <!-- Description -->

            <label>Description</label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe your pet..."
                required></textarea>


            <!-- Submit -->

            <button type="submit">
                Post Pet
            </button>

        </form>

    </div>

</section>


<script src="js/script.js"></script>

</body>

</html>
