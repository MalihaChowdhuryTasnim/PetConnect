<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>PetConnect | Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">

        <i class="fa-solid fa-paw"></i>
        <h2>PetConnect</h2>

    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="pets.html">Adopt</a>
        <a href="login.html">Post a Pet</a>
        <a href="ai.html">Ask Paws</a>

    </nav>

    <div>

        <button id="logoutBtn" type="button">

            <i class="fa-solid fa-right-from-bracket"></i>

            Admin Logout

        </button>

    </div>

</header>

<section class="admin-section">

   

    <h1>Admin Overview</h1>

    <div class="admin-stats">

        <div class="stat-card">
            <h3>Total Pets</h3>
            <p id="statTotalPets">-</p>
        </div>

        <div class="stat-card">
            <h3>Available</h3>
            <p id="statAvailablePets">-</p>
        </div>

        <div class="stat-card">
            <h3>Adopted</h3>
            <p id="statAdoptedPets">-</p>
        </div>

        <div class="stat-card">
            <h3>Total Users</h3>
            <p id="statTotalUsers">-</p>
        </div>

    </div>

    <h2>Pet Listings</h2>

    <table id="adminPetsTable">

        <tr>

            <th>Pet</th>
            <th>Type</th>
            <th>City</th>
            <th>Owner</th>
            <th>Status</th>
            <th>Actions</th>

        </tr>

        <!-- Rows are injected here by js/script.js -->

        <tr id="adminPetsEmptyRow" style="display:none;">

            <td colspan="6">
                No pets posted yet.
            </td>

        </tr>

    </table>

    <h2>Registered Users</h2>

    <table id="adminUsersTable">

        <tr>

            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>

        </tr>

        <!-- Rows are injected here by js/script.js -->

        <tr id="adminUsersEmptyRow" style="display:none;">

            <td colspan="4">
                No registered users yet.
            </td>

        </tr>

    </table>

</section>

<footer>

    <h3>PetConnect Admin Panel</h3>

    <p>© 2026 PetConnect</p>

</footer>

<script src="js/script.js"></script>

</body>

</html>
