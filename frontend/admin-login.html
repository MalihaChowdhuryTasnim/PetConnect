<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PetConnect | Admin Login</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
>

</head>


<body>


<div class="login-container">

    <div class="login-card">

        <h2>Admin Login</h2>

        <p>
            Only administrators can access this page.
        </p>


        <form id="adminLoginForm">

            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
                required
            >


            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                required
            >


            <button
                type="submit"
                id="adminLoginButton"
            >
                Login as Admin
            </button>


            <p
                id="adminLoginMessage"
                class="admin-login-message"
            ></p>

        </form>


        <a
            class="back-home"
            href="index.html"
        >
            ← Back to Home
        </a>

    </div>

</div>


<script src="js/script.js"></script>

</body>

</html>
