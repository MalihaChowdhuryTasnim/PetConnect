<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetConnect | Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<header>

    <div class="logo">

        <i class="fa-solid fa-paw"></i>

        <h2>PetConnect</h2>

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="pets.html">Adopt</a>

        <a href="post_pet.html">Post a Pet</a>

        <a href="ai.html">Ask Paws</a>

        <a href="shop.html">Shop</a>

    </nav>

    <button id="logoutBtn" type="button">

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

    </button>

</header>


<section class="dashboard">

    <div class="welcome-box">

        <div>

            <h4>WELCOME BACK</h4>

            <h1 id="welcomeName">
                Hi! 🌸
            </h1>

            <p>
                Here's what's happening with your pets.
            </p>

        </div>

    </div>


    <div class="stats-grid">

        <div class="stat-card">

            <h2 id="activePostsCount">
                0
            </h2>

            <p>
                Active Posts
            </p>

        </div>

        <div class="stat-card">

            <h2>
                0
            </h2>

            <p>
                AI Chats
            </p>

        </div>

    </div>


    <h2 class="section-title">
        My Posts
    </h2>


    <div id="myPostsContainer">

        <p>
            Loading your posts...
        </p>

    </div>

</section>


<footer>

    <div class="footer-content">

        <div class="footer-logo">

            <h3>
                PetConnect
            </h3>

        </div>

        <p>
            Adopt • Rescue • Love
        </p>

        <p class="copyright">
            © 2026 PetConnect
        </p>

    </div>

</footer>


<!-- ONLY external JavaScript -->

<script src="js/script.js"></script>

</body>

</html>
