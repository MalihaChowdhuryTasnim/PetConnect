<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PetConnect | Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


<!-- =================================
     DASHBOARD PROTECTION
================================= -->

<script>

    const token = localStorage.getItem("token");

    if (!token) {

        window.location.href = "login.html";

    }

</script>



<!-- =================================
     HEADER
================================= -->

<header>

    <div class="logo">

        <i class="fa-solid fa-paw"></i>

        <h2>PetConnect</h2>

    </div>


    <nav>

        <a href="index.html">Home</a>

        <a href="pets.html">Adopt</a>

        <a href="post_pet.html">Post a Pet</a>

        <a href="ai.html">Ask Paws</a>

        <a href="shop.html">Shop</a>

    </nav>


    <!-- Logout -->

    <button id="logoutBtn" type="button">

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

    </button>

</header>



<!-- =================================
     DASHBOARD
================================= -->

<section class="dashboard">


    <!-- =================================
         WELCOME
    ================================= -->

    <div class="welcome-box">

        <div>

            <h4>WELCOME BACK</h4>

            <h1 id="welcomeName">
                Hi! 🌸
            </h1>

            <p>
                Here's what's happening with your pets.
            </p>

        </div>

    </div>



    <!-- =================================
         STATISTICS
    ================================= -->

    <div class="stats-grid">


        <!-- Active Posts -->

        <div class="stat-card">

            <h2 id="activePostsCount">
                0
            </h2>

            <p>
                Active Posts
            </p>

        </div>


        <!-- Adopted -->

        <div class="stat-card">

            <h2>
                0
            </h2>

            <p>
                Adopted
            </p>

        </div>


        <!-- Saved Pets -->

        <div class="stat-card">

            <h2>
                0
            </h2>

            <p>
                Saved Pets
            </p>

        </div>


        <!-- AI Chats -->

        <div class="stat-card">

            <h2>
                0
            </h2>

            <p>
                AI Chats
            </p>

        </div>

    </div>



    <!-- =================================
         MY POSTS
    ================================= -->

    <h2 class="section-title">

        My Posts

    </h2>


    <div id="myPostsContainer">

        <p>
            Loading your posts...
        </p>

    </div>


</section>



<!-- =================================
     FOOTER
================================= -->

<footer>

    <div class="footer-content">

        <div class="footer-logo">

           

            <h3>
                PetConnect
            </h3>

        </div>


        <p>
            Adopt • Rescue • Love
        </p>


        <p class="copyright">

            © 2026 PetConnect

        </p>

    </div>

</footer>



<!-- =================================
     DASHBOARD JAVASCRIPT
================================= -->

<script>


// =================================
// GET SAVED USER
// =================================

const savedUser =
    JSON.parse(
        localStorage.getItem("user")
    );



// =================================
// DISPLAY USER NAME
// =================================

if (savedUser) {

    const welcomeName =
        document.getElementById(
            "welcomeName"
        );


    welcomeName.textContent =
        "Hi, " +
        savedUser.name +
        "! 🌸";

}



// =================================
// LOAD MY POSTS
// =================================

async function loadMyPosts() {


    const container =
        document.getElementById(
            "myPostsContainer"
        );


    try {


        const response =
            await fetch(
                "http://localhost:3000/my-pets",
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );



        // =================================
        // TOKEN EXPIRED / INVALID
        // =================================

        if (response.status === 401) {


            localStorage.removeItem(
                "token"
            );


            localStorage.removeItem(
                "user"
            );


            window.location.href =
                "login.html";


            return;

        }



        // =================================
        // GET PET DATA
        // =================================

        const pets =
            await response.json();



        // Remove loading message

        container.innerHTML = "";



        // =================================
        // NO POSTS
        // =================================

        if (!pets.length) {


            container.innerHTML = `

                <div class="no-posts">

                   

                    <span>
                        You have not posted any pets yet.
                    </span>

                </div>

            `;


            document.getElementById(
                "activePostsCount"
            ).textContent = "0";


            return;

        }



        // =================================
        // ACTIVE POST COUNT
        // =================================

        document.getElementById(
            "activePostsCount"
        ).textContent =
            pets.length;



        // =================================
        // CREATE PET CARDS
        // =================================

        pets.forEach(
            (pet) => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "post-card";



                // =================================
                // PET IMAGE
                // =================================

                let imagePath =
                    "images/dog1.jpeg";


                if (pet.image) {

                    imagePath =
                        "http://localhost:3000/uploads/" +
                        pet.image;

                }



                // =================================
                // PET CARD
                // =================================

                card.innerHTML = `

                    <div class="post-left">

                        <img
                            src="${imagePath}"
                            alt="${pet.name}"
                        >

                        <div>

                            <h3>
                                ${pet.name}
                            </h3>

                            <p>
                                ${pet.category}
                                ·
                                ${pet.location}
                            </p>

                            <p>
                                ${pet.breed}
                                ·
                                ${pet.age}
                            </p>

                        </div>

                    </div>


                    <button
                        class="mark-btn"
                        type="button"
                    >

                        Mark Adopted

                    </button>

                `;



                // =================================
                // MARK ADOPTED BUTTON
                // =================================

                const adoptedButton =
                    card.querySelector(
                        ".mark-btn"
                    );


                adoptedButton.addEventListener(
                    "click",
                    async function () {


                        const confirmAdopt =
                            confirm(
                                "Are you sure this pet has been adopted?"
                            );


                        if (!confirmAdopt) {

                            return;

                        }



                        try {


                            const deleteResponse =
                                await fetch(
                                    "http://localhost:3000/pets/" +
                                    pet._id,
                                    {

                                        method: "DELETE",

                                        headers: {

                                            "Authorization":
                                                "Bearer " +
                                                token

                                        }

                                    }
                                );



                            const data =
                                await deleteResponse.json();



                            alert(
                                data.message
                            );



                            // =================================
                            // SUCCESS
                            // =================================

                            if (
                                deleteResponse.ok
                            ) {


                                // Remove card

                                card.remove();


                                // Reload dashboard

                                loadMyPosts();

                            }


                        } catch (error) {


                            console.error(
                                "Delete error:",
                                error
                            );


                            alert(
                                "Unable to mark pet as adopted."
                            );

                        }

                    }
                );



                // Add card to page

                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {


        console.error(
            "Error loading my pets:",
            error
        );


        container.innerHTML = `

            <div class="no-posts">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <span>
                    Unable to load your posts.
                </span>

            </div>

        `;

    }

}



// =================================
// LOAD POSTS
// =================================

loadMyPosts();



// =================================
// LOGOUT
// =================================

const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );


logoutBtn.addEventListener(
    "click",
    function () {


        localStorage.removeItem(
            "token"
        );


        localStorage.removeItem(
            "user"
        );


        window.location.href =
            "login.html";

    }
);


</script>


</body>

</html>
