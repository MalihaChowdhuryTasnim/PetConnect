<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PetConnect | Admin Login</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>


<body>


<div class="login-container">

    <div class="login-card">

        <h2>Admin Login</h2>

        <p>
            Only administrators can access this page.
        </p>


        <form id="adminLoginForm">

            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
                required
            >


            <div class="password-field">

                <input
                    type="password"
                    id="adminPassword"
                    class="password-input"
                    placeholder="Password"
                    required
                >

                <i class="fa-solid fa-eye toggle-password" data-target="adminPassword"></i>

            </div>


            <button
                type="submit"
                id="adminLoginButton"
            >
                Login as Admin
            </button>


            <p
                id="adminLoginMessage"
                class="admin-login-message"
            ></p>

        </form>


        <a
            class="back-home"
            href="index.html"
        >
            ← Back to Home
        </a>

    </div>

</div>


<script src="js/script.js"></script>

</body>

</html>
