<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post a Pet | PetConnect</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <i class="fa-solid fa-paw"></i>
        <h2>PetConnect</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="pets.html">Adopt Pets</a>
        <a href="post-pet.html">Post a Pet</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

</header>

<section class="post-pet-section">

    <div class="post-form">

        <h1>Post Your Pet for Adoption 🐾</h1>

        <p>Fill in the information below to help your pet find a loving home.</p>

        <form id="postPetForm">

            <label>Pet Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter pet name"
                required>

            <label>Pet Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option>Dog</option>
                <option>Cat</option>
                <option>Rabbit</option>
                <option>Bird</option>
                <option>Fish</option>
            </select>

            <label>Breed</label>
            <input
                type="text"
                id="breed"
                placeholder="Example: Labrador"
                required>

            <label>Age</label>
            <input
                type="text"
                id="age"
                placeholder="Example: 2 Years"
                required>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <label>Vaccinated</label>
            <select id="vaccinated" required>
                <option value="">Select</option>
                <option>Yes</option>
                <option>No</option>
            </select>

            <label>Location</label>
            <input
                type="text"
                id="location"
                placeholder="Example: Dhaka"
                required>

            <label>Contact Number</label>
            <input
                type="tel"
                id="contact"
                placeholder="01XXXXXXXXX"
                required>

            <label>Description</label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe your pet..."
                required></textarea>

            <button type="submit">
                Post Pet
            </button>

        </form>

    </div>

</section>

<script src="js/script.js"></script>

</body>

</html>
