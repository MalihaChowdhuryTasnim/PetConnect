<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PetConnect | Adopt Pets</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<div class="logo">

<i class="fa-solid fa-paw"></i>

<h2>PetConnect</h2>

</div>

<nav>

    <a href="index.html">Home</a>

    <a href="pets.html">Adopt</a>

    <a href="login.html" id="postPetLink">
        Post a Pet
    </a>

    <a href="ai.html">Ask Paws</a>

    <a href="shop.html">Shop</a>

    <a href="dashboard.html"
       id="dashboardLink"
       style="display:none;">
        Dashboard
    </a>

    <button
        id="logoutBtn"
        type="button"
        style="display:none;">
        Logout
    </button>

    <a href="login.html"
       id="loginLink"
       class="login-btn">
        Login
    </a>

    <a href="register.html"
       id="registerLink"
       class="register-btn">

    </a>

<section class="pet-page">

<div class="search-box">

<input type="text" placeholder="Search pets...">

<select>

<option>Dogs</option>
<option>Cats</option>
<option>Birds</option>

</select>

<button>Search</button>

<div class="pet-grid" id="petGrid">

    <!-- Pets from MongoDB will appear here -->

<footer>

<h3>PetConnect</h3>

<p>Adopt • Rescue • Love</p>
