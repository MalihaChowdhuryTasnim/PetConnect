<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetConnect | Pet Details</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <!-- ===============================
     HEADER
================================ -->

    <header>

        <div class="logo">

            <i class="fa-solid fa-paw"></i>

            <h2>PetConnect</h2>

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="pets.html">
                Adopt
            </a>

            <a href="login.html" id="postPetLink">
                Post a Pet
            </a>

            <a href="ai.html">
                Ask Paws
            </a>

            <a href="shop.html">
                Shop
            </a>


            <!-- LOGIN -->

            <a href="login.html" id="loginLink" class="login-btn">

                Login

            </a>


            <!-- REGISTER -->

            <a href="register.html" id="registerLink" class="register-btn">

                Register

            </a>


            <!-- DASHBOARD -->

            <a href="dashboard.html" id="dashboardLink" style="display:none;">

                Dashboard

            </a>


            <!-- LOGOUT -->

            <button id="logoutBtn" type="button" style="display:none;">

                <i class="fa-solid fa-right-from-bracket"></i>
                Logout

            </button>

        </nav>

    </header>



    <!-- ===============================
     PET DETAILS
================================ -->

    <section class="pet-details">


        <!-- PET IMAGE -->

        <div class="pet-image">

            <img id="petImage" src="images/dog1.jpeg" alt="Pet">

        </div>



        <!-- PET INFORMATION -->

        <div class="pet-info">


            <h1 id="petName">
                Loading...
            </h1>


            <p>

                <strong>Breed:</strong>

                <span id="petBreed">
                    -
                </span>

            </p>


            <p>

                <strong>Age:</strong>

                <span id="petAge">
                    -
                </span>

            </p>


            <p>

                <strong>Gender:</strong>

                <span id="petGender">
                    -
                </span>

            </p>


            <p>

                <strong>Vaccinated:</strong>

                <span id="petVaccinated">
                    -
                </span>

            </p>


            <p>

                <strong>Location:</strong>

                <span id="petLocation">
                    -
                </span>

            </p>


            <p>

                <strong>Description:</strong>

                <span id="petDescription">
                    -
                </span>

            </p>


            <!-- OWNER -->

            <p>

                <strong>Owner:</strong>

                <span id="petOwner">
                    -
                </span>

            </p>


            <a href="#" class="pink-btn" id="adoptButton">
                Adopt Now
            </a>


        </div>

    </section>


    <script src="js/script.js"></script>

</body>

</html>
